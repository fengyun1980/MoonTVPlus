name: Build FengYun YingShi Android APK

# 风云影视（FengYunYingShi）手机端 APK 编译
# 构建产物：com.fengyun.mobile 应用，支持小米 HyperOS 超级岛上岛 + PiP 画中画

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '服务端 Base URL（不带路径，例如 https://example.com）'
        required: true
        default: ''
        type: string
      app_name:
        description: 'APP 桌面显示名称'
        required: true
        default: '风云影视'
        type: string
      version_name:
        description: '版本名（如 1.0.0）'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: '版本号（必须是整数）'
        required: false
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build FengYunYingShi APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare app icon from public/logo.png
        run: |
          cp public/logo.png apps/android-mobile/app/src/main/res/drawable/logo.png

      - name: Decode Android signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fengyun-release.keystore
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Release" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=release" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "Android signing secrets not fully set → building debug APK only."
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Debug" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=debug" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/android-mobile
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_PATH: /tmp/fengyun-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assemble${{ steps.signing.outputs.build_type_task }} \
            -PBASE_URL="$BASE_URL" \
            -PAPP_NAME="$APP_NAME" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Collect APK artifacts
        run: |
          mkdir -p /tmp/fengyun-apks
          APK_PATH="apps/android-mobile/app/build/outputs/apk/${{ steps.signing.outputs.build_type }}/app-${{ steps.signing.outputs.apk_suffix }}.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" \
              "/tmp/fengyun-apks/fengyun-yingshi-${{ inputs.version_name }}-${{ steps.signing.outputs.artifact_suffix }}.apk"
            echo "✅ APK found:"
            ls -lh /tmp/fengyun-apks
          else
            echo "❌ APK not found at $APK_PATH"
            echo "Available APK outputs:"
            find apps/android-mobile/app/build/outputs -name "*.apk" 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fengyun-yingshi-${{ inputs.version_name }}-${{ steps.signing.outputs.artifact_suffix }}
          path: /tmp/fengyun-apks/*.apk
          if-no-files-found: error
          retention-days: 30
